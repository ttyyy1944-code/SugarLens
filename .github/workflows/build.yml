name: SugarLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run tests and build mod
        run: gradle clean test build --no-daemon
      - name: Upload distributable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SugarLens-1.1.5
          path: |
            build/libs/sugarlens-1.1.5.jar
          if-no-files-found: error
          retention-days: 30
